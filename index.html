<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 BLE Bluetooth Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 22px;
      color: #333;
      text-align: center;
    }

    /* Connection area */
    .connection-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.connected { background: #4caf50; }
    .status-dot.disconnected { background: #f44336; }
    #statusText { font-size: 14px; color: #666; }

    /* Buttons */
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.85; }

    .btn-connect { background: #2196f3; color: #fff; }
    .btn-disconnect { background: #ff9800; color: #fff; }
    .btn-send { background: #4caf50; color: #fff; }
    .btn-led-on { background: #ffc107; color: #333; }
    .btn-led-off { background: #607d8b; color: #fff; }
    .btn-clear { background: #e0e0e0; color: #333; font-size: 12px; padding: 6px 12px; }

    /* LED control area */
    .led-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .led-controls h3 { font-size: 14px; color: #555; margin-right: auto; }

    /* Chat area */
    .chat-area {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      background: #fafafa;
    }
    .message {
      padding: 6px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-all;
    }
    .message.received { background: #e3f2fd; color: #1565c0; }
    .message.sent { background: #e8f5e9; color: #2e7d32; text-align: right; }
    .message.system { background: #fff3e0; color: #e65100; font-style: italic; }

    /* Input area */
    .input-area {
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: #2196f3; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tip { font-size: 12px; color: #999; }

    .file-controls {
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .filesystem-area {

      padding: 12px;

      background: #fafafa;

      border-radius: 8px;

      border: 1px solid #eee;
    }

    .filesystem-header {

      display: flex;

      align-items: center;

      margin-bottom: 10px;
    }

    .filesystem-header h3 {

      font-size: 14px;

      color: #555;

      margin-right: auto;
    }

    .btn-files {

      background: #2196f3;

      color: white;

      padding: 7px 12px;

      border: none;

      border-radius: 6px;

      cursor: pointer;

      font-size: 12px;
    }

    .btn-files:disabled {

      opacity: 0.4;

      cursor: not-allowed;
    }

    .btn-delete-file {

      background: #f44336;

      color: white;

      border: none;

      border-radius: 5px;

      padding: 5px 8px;

      font-size: 12px;

      cursor: pointer;
    }

    .btn-delete-file:hover {

      opacity: 0.8;
    }

    .btn-delete-file:disabled {

      opacity: 0.4;

      cursor: not-allowed;
    }

    #filesystemStatus {

      font-size: 12px;

      color: #888;

      margin-bottom: 8px;
    }

    .filesystem-table-container {

      max-height: 220px;

      overflow-y: auto;

      border: 1px solid #ddd;

      border-radius: 6px;

      background: white;
    }

    #filesystemTable {

      width: 100%;

      border-collapse: collapse;

      font-size: 13px;
    }

    #filesystemTable th {

      text-align: left;

      padding: 8px;

      background: #f5f5f5;

      border-bottom: 1px solid #ddd;
    }

    #filesystemTable td {

      padding: 8px;

      border-bottom: 1px solid #eee;

      word-break: break-all;
    }

    #filesystemTable td:nth-child(2) {

      text-align: right;

      white-space: nowrap;
    }

    #filesystemTable td:last-child {

      text-align: center;

      white-space: nowrap;
    }

    .empty-filesystem {

      text-align: center;

      color: #999;

      padding: 15px;
    }

    #progressText {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
      </style>
</head>
<body>
  <div class="container">
    <h1>ESP32 BLE Bluetooth Chat</h1>

    <!-- Connection -->
    <div class="connection-area">
      <button id="connectBtn" class="btn-connect">Connect Bluetooth</button>
      <button id="disconnectBtn" class="btn-disconnect" disabled>Disconnect</button>
      <span id="statusDot" class="status-dot disconnected"></span>
      <span id="statusText">Disconnected</span>
    </div>

    <!-- LED Control -->
    <div class="led-controls">
      <h3>LED Control</h3>
      <button id="ledOnBtn" class="btn-led-on" disabled>Turn LED On</button>
      <button id="ledOffBtn" class="btn-led-off" disabled>Turn LED Off</button>
    </div>

    <div class="filesystem-area">

      <div class="filesystem-header">

        <h3>ESP32 Filesystem</h3>

        <button
          id="refreshFilesBtn"
          class="btn-files"
          disabled
        >
          Refresh
        </button>

      </div>

      <div id="filesystemStatus">
        Not connected
      </div>

      <div class="filesystem-table-container">

        <table id="filesystemTable">

          <thead>

            <tr>
              <th>File</th>
              <th>Size</th>
              <th>Actions</th>
            </tr>

          </thead>

          <tbody id="filesystemBody">
          </tbody>

        </table>

      </div>

    </div>

    <div class="file-controls">
    
      <h3>File Upload</h3>
      <label for="dirSelect">Select Target Directory:</label>

      <select
        id="dirSelect"
        disabled
      >
        <option value="/" selected>/</option>
      </select>
      
    <br>
    <input
      type="file"
      id="fileInput"
      disabled
    >

    <button
      id="uploadBtn"
      disabled
    >
      Upload File
    </button>

    <div id="progressText">
      No file selected
    </div>

  </div>

    <!-- Chat Messages -->
    <div id="messages" class="chat-area"></div>

    <!-- Input -->
    <div class="input-area">
      <input id="input" type="text" placeholder="Type a message and press Enter..." disabled>
      <button id="sendBtn" class="btn-send" disabled>Send</button>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="tip">Tip: Use Chrome / Edge browser</span>
      <button id="clearBtn" class="btn-clear">Clear Messages</button>
    </div>
  </div>

  <script src="bluetooth_web.js"></script>
</body>
</html>
